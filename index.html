<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOT ĐMN MOD HỖ TRỢ</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ================= PHẦN 2: GIAO DIỆN - CSS ================= */
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Be Vietnam Pro', sans-serif;
  background: #000000;
  color: white;
  overflow: hidden;
  height: 100vh;
}
/* NỀN BONG BÓNG TUYẾT */
#bubble-container {
  position: fixed; inset:0; pointer-events:none; z-index:0;
}
.bubble {
  position: absolute; top:-50px;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(180,220,255,0.2));
  border-radius: 50%; 
  box-shadow: 0 0 15px rgba(150,200,255,0.6), inset -5px -5px 10px rgba(255,255,255,0.3);
  animation: fall linear infinite;
}
@keyframes fall {
  0% { transform: translateY(-10vh) translateX(0px); opacity:0; }
  10% { opacity:1; }
  90% { opacity:1; }
  100% { transform: translateY(110vh) translateX(var(--drift)); opacity:0; }
}

/* TOP BAR ZALO */
.top-bar {
  position: relative; z-index:10;
  height: 68px; background: rgba(18,18,18,0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px;
}
.top-left { display:flex; align-items:center; gap:12px; }
.top-info h1 { font-size:15px; font-weight:700; letter-spacing:0.5px; }
.top-info p { font-size:12px; color:#22c55e; margin-top:2px; }

/* AVATAR ROBOT BẰNG CODE */
.robot-avatar {
  width:44px; height:44px; background: linear-gradient(135deg, #1e293b, #0f172a);
  border-radius:12px; border:1px solid rgba(255,255,255,0.15);
  position:relative; display:flex; align-items:center; justify-content:center;
  box-shadow: 0 0 20px rgba(59,130,246,0.3);
}
.robot-avatar .eyes { display:flex; gap:8px; }
.robot-avatar .eye { width:7px; height:7px; background:#60a5fa; border-radius:50%; box-shadow:0 0 8px #60a5fa; animation: blink 3s infinite; }
.robot-avatar .antenna { position:absolute; top:-6px; width:2px; height:6px; background:#94a3b8; }
.robot-avatar .antenna::after { content:''; position:absolute; top:-4px; left:-3px; width:8px; height:8px; background:#ef4444; border-radius:50%; box-shadow:0 0 6px #ef4444; }
@keyframes blink { 0%, 90%, 100% { transform:scaleY(1); } 95% { transform:scaleY(0.1); } }

/* NÚT THÙNG RÁC BẰNG CODE */
.trash-btn {
  width:40px; height:40px; border-radius:10px; background: rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08); cursor:pointer;
  display:flex; align-items:center; justify-content:center; position:relative;
  transition:0.2s;
}
.trash-btn:hover { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.3); }
.trash-icon { width:18px; height:20px; position:relative; }
.trash-icon .lid { position:absolute; top:0; left:0; width:18px; height:3px; background:#cbd5e1; border-radius:2px; }
.trash-icon .lid::before { content:''; position:absolute; top:-3px; left:6px; width:6px; height:3px; background:#cbd5e1; border-radius:1px; }
.trash-icon .body { position:absolute; top:4px; left:1px; width:16px; height:14px; background: rgba(203,213,225,0.9); border-radius:0 0 3px 3px; display:flex; justify-content:space-around; padding-top:3px; }
.trash-icon .line { width:2px; height:8px; background:#334155; border-radius:1px; }

/* KHUNG CHAT */
.chat-container {
  position:relative; z-index:5;
  height: calc(100vh - 68px - 110px);
  overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px;
}
.chat-container::-webkit-scrollbar { width:0; }
.bubble-row { display:flex; gap:8px; max-width:85%; animation: fadeUp 0.3s ease; }
.bubble-row.user { align-self:flex-end; flex-direction:row-reverse; }
.bubble-row.bot { align-self:flex-start; }
.msg-avatar { width:28px; height:28px; flex-shrink:0; border-radius:8px; background:#1e293b; border:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; }
.msg-avatar .eye { width:4px; height:4px; background:#60a5fa; border-radius:50%; }
.msg-bubble { padding:10px 14px; border-radius:18px; font-size:14px; line-height:1.5; position:relative; }
.bot .msg-bubble { background: rgba(30,30,30,0.9); border:1px solid rgba(255,255,255,0.08); border-bottom-left-radius:4px; }
.user .msg-bubble { background: linear-gradient(135deg, #3b82f6, #2563eb); border-bottom-right-radius:4px; }
.time { font-size:10px; color:rgba(255,255,255,0.4); margin-top:4px; }
.typing { display:flex; gap:4px; align-items:center; padding:12px 16px; background: rgba(30,30,30,0.9); border-radius:18px; border-bottom-left-radius:4px; width:fit-content; }
.typing span { width:6px; height:6px; background:#94a3b8; border-radius:50%; animation: typingDot 1.2s infinite; }
.typing span:nth-child(2){ animation-delay:0.2s; } .typing span:nth-child(3){ animation-delay:0.4s; }
@keyframes typingDot { 0%,80%,100%{ transform:translateY(0); opacity:0.5; } 40%{ transform:translateY(-5px); opacity:1; } }
@keyframes fadeUp { from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }

/* KHUNG CÂU HỎI Ở DƯỚI */
  .bottom-area {
  position:relative; z-index:10;
  height:110px; background: rgba(12,12,12,0.95); backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,0.06); padding:10px 16px;
}
.hint { font-size:11px; color:rgba(255,255,255,0.35); text-align:center; margin-bottom:8px; letter-spacing:0.5px; }
.chips { display:flex; gap:10px; overflow-x:auto; padding-bottom:8px; }
.chips::-webkit-scrollbar{ display:none; }
.chip {
  white-space:nowrap; padding:10px 16px; background: rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1); border-radius:20px; font-size:13px; cursor:pointer;
  transition:0.2s; flex-shrink:0;
}
.chip:hover { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.4); }

/* POPUP XÓA ĐẸP */
.modal-overlay { position:fixed; inset:0; background: rgba(0,0,0,0.7); backdrop-filter:blur(10px); z-index:50; display:flex; align-items:center; justify-content:center; animation: fadeIn 0.2s; }
.modal { width:90%; max-width:380px; background: #121212; border:1px solid rgba(255,255,255,0.12); border-radius:24px; padding:24px; animation: scaleIn 0.3s; }
.modal h3 { font-size:18px; font-weight:700; margin-bottom:8px; }
.modal p { font-size:13px; color:rgba(255,255,255,0.6); line-height:1.5; margin-bottom:6px; }
.modal .note { background: rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.2); border-radius:12px; padding:10px 12px; font-size:12px; color:#fca5a5; margin:16px 0; }
.modal-actions { display:flex; gap:12px; margin-top:20px; }
.btn { flex:1; padding:12px; border-radius:14px; font-size:14px; font-weight:600; border:none; cursor:pointer; transition:0.2s; }
.btn-cancel { background: rgba(255,255,255,0.08); color:white; }
.btn-confirm { background: #ef4444; color:white; }
.btn-confirm:disabled { background: #3f3f3f; color:#888; cursor:not-allowed; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes scaleIn { from{opacity:0; transform:scale(0.9)} to{opacity:1; transform:scale(1)} }

</style>
</head>
<body>
<div id="bubble-container"></div>
<div class="top-bar">
  <div class="top-left">
    <div class="robot-avatar">
      <div class="antenna"></div>
      <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
    </div>
    <div class="top-info">
      <h1 id="bot-name">BOT ĐMN MOD HỖ TRỢ</h1>
      <p id="status">🟢 HOẠT ĐỘNG</p>
    </div>
  </div>
  <div class="trash-btn" onclick="openDeleteModal()" title="Xóa cuộc trò chuyện">
    <div class="trash-icon"><div class="lid"></div><div class="body"><div class="line"></div><div class="line"></div><div class="line"></div></div></div>
  </div>
</div>
<div class="chat-container" id="chat"></div>
<div class="bottom-area">
  <div class="hint">↔ Kéo sang • Nhấn để hỏi nhanh</div>
  <div class="chips" id="chips"></div>
</div>
<script>
// ================= PHẦN 1: CHỈNH SỬA - BẠN SỬA Ở ĐÂY =================
// File này chứa tất cả những gì admin có thể sửa

const CONFIG = {
  // Tên bot hiện trên top
  botName: "BOT ĐMN MOD HỖ TRỢ",
  statusText: "🟢 HOẠT ĐỘNG",

  // Tin nhắn chào mừng đầu tiên - BẠN SỬA ĐƯỢC
  welcomeMessage: `Xin chào bạn, đã sử dụng BOT ĐMN MOD HỖ TRỢ.

📌 CÁCH SỬ DỤNG WEB:
• Nhấn vào câu hỏi bên dưới để hỏi nhanh
• Mỗi câu trả lời sẽ hiện sau 2-4 giây
• Tin nhắn được lưu tự động, tải lại không mất
• Nhấn 🗑️ để xóa cuộc trò chuyện

Bạn cần hỗ trợ gì cứ nhấn câu hỏi nhé!`,

  // Chỉ 3 câu hỏi - Muốn thêm thì copy 1 cục { ... } dán xuống
  questions: [
    {
      question: "Cài mod sao vậy?",
      answer: "Bạn tải file mod ở kênh mình rồi làm theo hướng dẫn nhé! Cần hỗ trợ thêm cứ hỏi admin.",
      timeDelay: 2000, // 2 giây
      waitingText: "đang tạo câu trả lời..."
    },
    {
      question: "Mod có bị ban không?",
      answer: "Mod bên mình có anti-ban, nhưng bạn nhớ chơi an toàn, đừng buff quá lộ nhé! Chúc bạn leo rank vui vẻ.",
      timeDelay: 3000, // 3 giây
      waitingText: "đang kiểm tra..."
    },
    {
      question: "Liên hệ admin sao?",
      answer: "Bạn nhắn trực tiếp cho admin qua Facebook nhé, mình hỗ trợ 24/7 luôn! Đừng ngại hỏi nha.",
      timeDelay: 2500, // 2.5 giây
      waitingText: "đang tìm thông tin..."
    }
  ]
};

</script>
<script>
// ================= PHẦN 3: LOGIC - LƯU, XÓA, CHAT =================
const STORAGE_KEY = "dmn_mod_bot_history";
let messages = [];
  
// Tạo bong bóng tuyết
function createBubbles() {
  const container = document.getElementById('bubble-container');
  for(let i=0;i<35;i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 8 + Math.random()*32;
    b.style.width = size+'px'; b.style.height = size+'px';
    b.style.left = Math.random()*100+'%';
    b.style.setProperty('--drift', (Math.random()*100-50)+'px');
    b.style.animationDuration = (8+Math.random()*12)+'s';
    b.style.animationDelay = Math.random()*8+'s';
    b.style.opacity = 0.3+Math.random()*0.6;
    container.appendChild(b);
  }
}

// Lưu vào localStorage
function saveMessages() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
}

// Load tin nhắn cũ
function loadMessages() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved) {
    try { messages = JSON.parse(saved); } catch(e){ messages=[]; }
  }
  if(messages.length===0) {
    // Tin nhắn chào mừng đầu tiên - LẤY TỪ CONFIG
    addBotMessage(CONFIG.welcomeMessage, getTime(), false);
  } else {
    renderAll();
  }
}

function getTime() {
  const now = new Date();
  return now.getHours()+":"+String(now.getMinutes()).padStart(2,'0');
}

function renderAll() {
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  messages.forEach(m => {
    if(m.type==='user') chat.appendChild(createUserBubble(m.text, m.time));
    else if(m.type==='bot') chat.appendChild(createBotBubble(m.text, m.time));
  });
  chat.scrollTop = chat.scrollHeight;
}

function createUserBubble(text, time) {
  const row = document.createElement('div'); row.className='bubble-row user';
  row.innerHTML = `<div class="msg-bubble">${text}<div class="time">${time}</div></div>`;
  return row;
}
function createBotBubble(text, time) {
  const row = document.createElement('div'); row.className='bubble-row bot';
  row.innerHTML = `
    <div class="msg-avatar"><div style="display:flex;gap:3px"><div class="eye"></div><div class="eye"></div></div></div>
    <div><div class="msg-bubble">${text.replace(/\n/g,'<br>')}<div class="time">${time}</div></div></div>
  `;
  return row;
}

function addUserMessage(text) {
  const time = getTime();
  messages.push({type:'user', text, time});
  saveMessages();
  const chat = document.getElementById('chat');
  chat.appendChild(createUserBubble(text, time));
  chat.scrollTop = chat.scrollHeight;
}

function addBotMessage(text, time, save=true) {
  if(save) { messages.push({type:'bot', text, time}); saveMessages(); }
  const chat = document.getElementById('chat');
  chat.appendChild(createBotBubble(text, time));
  chat.scrollTop = chat.scrollHeight;
}

// Khi nhấn câu hỏi
function askQuestion(index) {
  const q = CONFIG.questions[index];
  if(!q) return;
  addUserMessage(q.question);
  
  // Hiện đang gõ
  const chat = document.getElementById('chat');
  const typingRow = document.createElement('div'); typingRow.className='bubble-row bot'; typingRow.id='typing';
  typingRow.innerHTML = `
    <div class="msg-avatar"><div style="display:flex;gap:3px"><div class="eye"></div><div class="eye"></div></div></div>
    <div class="typing"><span></span><span></span><span></span><div style="margin-left:8px;font-size:12px;color:#94a3b8">${q.waitingText}</div></div>
  `;
  chat.appendChild(typingRow);
  chat.scrollTop = chat.scrollHeight;

  setTimeout(()=>{
    document.getElementById('typing')?.remove();
    addBotMessage(q.answer, getTime());
  }, q.timeDelay);
}

// Render chips câu hỏi
function renderChips() {
  const chipsDiv = document.getElementById('chips');
  chipsDiv.innerHTML = '';
  CONFIG.questions.forEach((q,i)=>{
    const chip = document.createElement('div');
    chip.className='chip'; chip.textContent = q.question;
    chip.onclick = ()=> askQuestion(i);
    chipsDiv.appendChild(chip);
  });
  document.getElementById('bot-name').textContent = CONFIG.botName;
  document.getElementById('status').textContent = CONFIG.statusText;
}

// NÚT XÓA - POPUP ĐẾM 5 GIÂY
function openDeleteModal() {
  const overlay = document.createElement('div'); overlay.className='modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Bạn có chắc muốn xóa?</h3>
      <p>Web sẽ reset về trạng thái ban đầu, toàn bộ tin nhắn sẽ mất.</p>
      <div class="note">⚠️ Lưu ý: Toàn bộ tin nhắn đã lưu sẽ bị xóa vĩnh viễn và không thể khôi phục. Hãy cân nhắc trước khi xóa. Bạn phải chờ 5 giây để đọc kỹ lưu ý này.</div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">HỦY</button>
        <button class="btn btn-confirm" id="confirmBtn" disabled>XÁC NHẬN (5)</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e)=> { if(e.target===overlay) closeModal(); };

  let sec = 5;
  const btn = document.getElementById('confirmBtn');
  const timer = setInterval(()=>{
    sec--;
    if(sec>0) btn.textContent = `XÁC NHẬN (${sec})`;
    else { btn.textContent='XÁC NHẬN'; btn.disabled=false; clearInterval(timer); }
  },1000);

  btn.onclick = ()=>{
    localStorage.removeItem(STORAGE_KEY);
    messages=[];
    document.getElementById('chat').innerHTML='';
    addBotMessage(CONFIG.welcomeMessage, getTime(), false);
    messages = [{type:'bot', text:CONFIG.welcomeMessage, time:getTime()}];
    saveMessages();
    closeModal();
  };
}
function closeModal(){ document.querySelector('.modal-overlay')?.remove(); }

// Khởi chạy
window.onload = ()=>{
  createBubbles();
  loadMessages();
  renderChips();
};

</script>
</body>
</html>
