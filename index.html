<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BOT ĐMN MOD HỖ TRỢ</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>/* ========== MOBILE FIX 100% VỪA KHÍT ĐIỆN THOẠI ========== */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  font-family: 'Be Vietnam Pro', sans-serif;
  background:#000; color:white;
  display:flex; flex-direction:column;
  height:100vh; height:100dvh;
}
#bubble-container { position:fixed; inset:0; pointer-events:none; z-index:0; }
.bubble {
  position:absolute; top:-50px;
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.85), rgba(180,220,255,0.25));
  border-radius:50%; box-shadow:0 0 12px rgba(150,200,255,0.5), inset -4px -4px 8px rgba(255,255,255,0.3);
  animation:fall linear infinite;
}
@keyframes fall { 0%{transform:translateY(-10vh) translateX(0); opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{transform:translateY(110vh) translateX(var(--drift)); opacity:0;} }

/* TOP BAR - CỐ ĐỊNH */
.top-bar {
  position:relative; z-index:10; flex-shrink:0;
  height:62px; min-height:62px;
  background:rgba(18,18,18,0.95); backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex; align-items:center; justify-content:space-between; padding:0 14px;
}
.top-left { display:flex; align-items:center; gap:10px; }
.top-info h1 { font-size:14px; font-weight:700; }
.top-info p { font-size:11px; color:#22c55e; }
.robot-avatar { width:38px; height:38px; background:linear-gradient(135deg,#1e293b,#0f172a); border-radius:10px; border:1px solid rgba(255,255,255,0.15); position:relative; display:flex; align-items:center; justify-content:center; box-shadow:0 0 15px rgba(59,130,246,0.25); }
.robot-avatar .eyes{ display:flex; gap:6px; }
.robot-avatar .eye{ width:6px; height:6px; background:#60a5fa; border-radius:50%; box-shadow:0 0 6px #60a5fa; animation:blink 3s infinite; }
.robot-avatar .antenna{ position:absolute; top:-5px; width:2px; height:5px; background:#94a3b8; }
.robot-avatar .antenna::after{ content:''; position:absolute; top:-3px; left:-2.5px; width:7px; height:7px; background:#ef4444; border-radius:50%; box-shadow:0 0 5px #ef4444; }
@keyframes blink{ 0%,90%,100%{transform:scaleY(1);}95%{transform:scaleY(0.1);} }
.trash-btn{ width:36px; height:36px; border-radius:9px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; cursor:pointer; }
.trash-icon{ width:16px; height:18px; position:relative; }
.trash-icon .lid{ position:absolute; top:0; left:0; width:16px; height:2.5px; background:#cbd5e1; border-radius:2px; }
.trash-icon .lid::before{ content:''; position:absolute; top:-2.5px; left:5px; width:5px; height:2.5px; background:#cbd5e1; border-radius:1px; }
.trash-icon .body{ position:absolute; top:3.5px; left:1px; width:14px; height:12px; background:rgba(203,213,225,0.9); border-radius:0 0 3px 3px; display:flex; justify-content:space-around; padding-top:2px; }
.trash-icon .line{ width:1.5px; height:7px; background:#334155; border-radius:1px; }

/* CHAT - CO GIÃN HẾT CỠ */
.chat-container{
  position:relative; z-index:5; flex:1; overflow-y:auto; overflow-x:hidden;
  padding:14px 12px; display:flex; flex-direction:column; gap:10px;
  -webkit-overflow-scrolling:touch;
}
.chat-container::-webkit-scrollbar{ display:none; }
.bubble-row{ display:flex; gap:7px; max-width:82%; animation:fadeUp 0.25s ease; }
.bubble-row.user{ align-self:flex-end; flex-direction:row-reverse; }
.bubble-row.bot{ align-self:flex-start; }
.msg-avatar{ width:26px; height:26px; flex-shrink:0; border-radius:7px; background:#1e293b; border:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; }
.msg-avatar .eye{ width:3.5px; height:3.5px; background:#60a5fa; border-radius:50%; }
.msg-bubble{ padding:9px 12px; border-radius:16px; font-size:13.5px; line-height:1.45; word-break:break-word; }
.bot .msg-bubble{ background:rgba(28,28,28,0.92); border:1px solid rgba(255,255,255,0.07); border-bottom-left-radius:4px; }
.user .msg-bubble{ background:linear-gradient(135deg,#3b82f6,#2563eb); border-bottom-right-radius:4px; }
.time{ font-size:10px; color:rgba(255,255,255,0.35); margin-top:3px; }
.typing{ display:flex; gap:3px; align-items:center; padding:10px 14px; background:rgba(28,28,28,0.92); border-radius:16px; border-bottom-left-radius:4px; width:fit-content; }
.typing span{ width:5px; height:5px; background:#94a3b8; border-radius:50%; animation:typingDot 1.2s infinite; }
.typing span:nth-child(2){ animation-delay:0.2s; } .typing span:nth-child(3){ animation-delay:0.4s; }
@keyframes typingDot{ 0%,80%,100%{ transform:translateY(0); opacity:0.5;}40%{ transform:translateY(-4px); opacity:1; } }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }

/* BOTTOM - FIX CỨNG, KHÔNG BỊ CHE */
.bottom-area{
  position:relative; z-index:10; flex-shrink:0;
  background:rgba(10,10,10,0.98); backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,0.06);
  padding:8px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));
}
.hint{ font-size:10px; color:rgba(255,255,255,0.3); text-align:center; margin-bottom:6px; letter-spacing:0.3px; }
.chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
.chips::-webkit-scrollbar{ display:none; }
.chip{ white-space:nowrap; padding:9px 14px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1); border-radius:18px; font-size:12.5px; cursor:pointer; scroll-snap-align:start; flex-shrink:0; transition:0.15s; }
.chip:active{ transform:scale(0.96); background:rgba(59,130,246,0.2); }

/* MODAL */
.modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(12px); z-index:50; display:flex; align-items:center; justify-content:center; padding:16px; animation:fadeIn 0.2s; }
.modal{ width:100%; max-width:360px; background:#151515; border:1px solid rgba(255,255,255,0.12); border-radius:22px; padding:20px; animation:scaleIn 0.25s; }
.modal h3{ font-size:16px; font-weight:700; margin-bottom:6px; }
.modal p{ font-size:12.5px; color:rgba(255,255,255,0.6); line-height:1.45; }
.modal .note{ background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.18); border-radius:11px; padding:9px 11px; font-size:11.5px; color:#fca5a5; margin:12px 0; line-height:1.4; }
.modal-actions{ display:flex; gap:10px; margin-top:16px; }
.btn{ flex:1; padding:11px; border-radius:12px; font-size:13.5px; font-weight:600; border:none; cursor:pointer; }
.btn-cancel{ background:rgba(255,255,255,0.08); color:white; }
.btn-confirm{ background:#ef4444; color:white; }
.btn-confirm:disabled{ background:#2a2a2a; color:#666; }
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
@keyframes scaleIn{ from{opacity:0; transform:scale(0.92)} to{opacity:1; transform:scale(1)} }
</style>
</head>
<body>
<div id="bubble-container"></div>
<div class="top-bar">
  <div class="top-left">
    <div class="robot-avatar"><div class="antenna"></div><div class="eyes"><div class="eye"></div><div class="eye"></div></div></div>
    <div class="top-info"><h1 id="bot-name">BOT ĐMN MOD HỖ TRỢ</h1><p id="status">🟢 HOẠT ĐỘNG</p></div>
  </div>
  <div class="trash-btn" onclick="openDeleteModal()"><div class="trash-icon"><div class="lid"></div><div class="body"><div class="line"></div><div class="line"></div><div class="line"></div></div></div></div>
</div>
<div class="chat-container" id="chat"></div>
<div class="bottom-area"><div class="hint">↔ Kéo sang • Nhấn để hỏi nhanh</div><div class="chips" id="chips"></div></div>
<script>// ================= PHẦN 1: CHỈNH SỬA - BẠN SỬA Ở ĐÂY =================
// File này chứa tất cả những gì admin có thể sửa

const CONFIG = {
  // Tên bot hiện trên top
  botName: "BOT ĐMN MOD HỖ TRỢ",
  statusText: "🟢 HOẠT ĐỘNG",
  
  // Tin nhắn chào mừng đầu tiên - BẠN SỬA ĐƯỢC
  welcomeMessage: `Xin chào bạn, đã sử dụng BOT ĐMN MOD HỖ TRỢ.

📌 CÁCH SỬ DỤNG WEB:
• Nhấn vào câu hỏi bên dưới để hỏi nhanh
• Mỗi câu trả lời sẽ hiện sau 2-4 giây
• Tin nhắn được lưu tự động, tải lại không mất
• Nhấn 🗑️ để xóa cuộc trò chuyện

Bạn cần hỗ trợ gì cứ nhấn câu hỏi nhé!`,

  // Chỉ 3 câu hỏi - Muốn thêm thì copy 1 cục { ... } dán xuống
  questions: [
    {
      question: "Cài mod sao vậy?",
      answer: "Bạn tải file mod ở kênh mình rồi làm theo hướng dẫn nhé! Cần hỗ trợ thêm cứ hỏi admin.",
      timeDelay: 2000, // 2 giây
      waitingText: "đang tạo câu trả lời..."
    },
    {
      question: "Mod có bị ban không?",
      answer: "Mod bên mình có anti-ban, nhưng bạn nhớ chơi an toàn, đừng buff quá lộ nhé! Chúc bạn leo rank vui vẻ.",
      timeDelay: 3000, // 3 giây
      waitingText: "đang kiểm tra..."
    },
    {
      question: "Liên hệ admin sao?",
      answer: "Bạn nhắn trực tiếp cho admin qua Facebook nhé, mình hỗ trợ 24/7 luôn! Đừng ngại hỏi nha.",
      timeDelay: 2500, // 2.5 giây
      waitingText: "đang tìm thông tin..."
    }
  ]
};
</script>
<script>// ================= PHẦN 3: LOGIC - LƯU, XÓA, CHAT =================
const STORAGE_KEY = "dmn_mod_bot_history";
let messages = [];

// Tạo bong bóng tuyết
function createBubbles() {
  const container = document.getElementById('bubble-container');
  for(let i=0;i<35;i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 8 + Math.random()*32;
    b.style.width = size+'px'; b.style.height = size+'px';
    b.style.left = Math.random()*100+'%';
    b.style.setProperty('--drift', (Math.random()*100-50)+'px');
    b.style.animationDuration = (8+Math.random()*12)+'s';
    b.style.animationDelay = Math.random()*8+'s';
    b.style.opacity = 0.3+Math.random()*0.6;
    container.appendChild(b);
  }
}

// Lưu vào localStorage
function saveMessages() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
}

// Load tin nhắn cũ
function loadMessages() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved) {
    try { messages = JSON.parse(saved); } catch(e){ messages=[]; }
  }
  if(messages.length===0) {
    // Tin nhắn chào mừng đầu tiên - LẤY TỪ CONFIG
    addBotMessage(CONFIG.welcomeMessage, getTime(), false);
  } else {
    renderAll();
  }
}

function getTime() {
  const now = new Date();
  return now.getHours()+":"+String(now.getMinutes()).padStart(2,'0');
}

function renderAll() {
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  messages.forEach(m => {
    if(m.type==='user') chat.appendChild(createUserBubble(m.text, m.time));
    else if(m.type==='bot') chat.appendChild(createBotBubble(m.text, m.time));
  });
  chat.scrollTop = chat.scrollHeight;
}

function createUserBubble(text, time) {
  const row = document.createElement('div'); row.className='bubble-row user';
  row.innerHTML = `<div class="msg-bubble">${text}<div class="time">${time}</div></div>`;
  return row;
}
function createBotBubble(text, time) {
  const row = document.createElement('div'); row.className='bubble-row bot';
  row.innerHTML = `
    <div class="msg-avatar"><div style="display:flex;gap:3px"><div class="eye"></div><div class="eye"></div></div></div>
    <div><div class="msg-bubble">${text.replace(/\n/g,'<br>')}<div class="time">${time}</div></div></div>
  `;
  return row;
}

function addUserMessage(text) {
  const time = getTime();
  messages.push({type:'user', text, time});
  saveMessages();
  const chat = document.getElementById('chat');
  chat.appendChild(createUserBubble(text, time));
  chat.scrollTop = chat.scrollHeight;
}

function addBotMessage(text, time, save=true) {
  if(save) { messages.push({type:'bot', text, time}); saveMessages(); }
  const chat = document.getElementById('chat');
  chat.appendChild(createBotBubble(text, time));
  chat.scrollTop = chat.scrollHeight;
}

// Khi nhấn câu hỏi
function askQuestion(index) {
  const q = CONFIG.questions[index];
  if(!q) return;
  addUserMessage(q.question);
  
  // Hiện đang gõ
  const chat = document.getElementById('chat');
  const typingRow = document.createElement('div'); typingRow.className='bubble-row bot'; typingRow.id='typing';
  typingRow.innerHTML = `
    <div class="msg-avatar"><div style="display:flex;gap:3px"><div class="eye"></div><div class="eye"></div></div></div>
    <div class="typing"><span></span><span></span><span></span><div style="margin-left:8px;font-size:12px;color:#94a3b8">${q.waitingText}</div></div>
  `;
  chat.appendChild(typingRow);
  chat.scrollTop = chat.scrollHeight;

  setTimeout(()=>{
    document.getElementById('typing')?.remove();
    addBotMessage(q.answer, getTime());
  }, q.timeDelay);
}

// Render chips câu hỏi
function renderChips() {
  const chipsDiv = document.getElementById('chips');
  chipsDiv.innerHTML = '';
  CONFIG.questions.forEach((q,i)=>{
    const chip = document.createElement('div');
    chip.className='chip'; chip.textContent = q.question;
    chip.onclick = ()=> askQuestion(i);
    chipsDiv.appendChild(chip);
  });
  document.getElementById('bot-name').textContent = CONFIG.botName;
  document.getElementById('status').textContent = CONFIG.statusText;
}

// NÚT XÓA - POPUP ĐẾM 5 GIÂY
function openDeleteModal() {
  const overlay = document.createElement('div'); overlay.className='modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Bạn có chắc muốn xóa?</h3>
      <p>Web sẽ reset về trạng thái ban đầu, toàn bộ tin nhắn sẽ mất.</p>
      <div class="note">⚠️ Lưu ý: Toàn bộ tin nhắn đã lưu sẽ bị xóa vĩnh viễn và không thể khôi phục. Hãy cân nhắc trước khi xóa. Bạn phải chờ 5 giây để đọc kỹ lưu ý này.</div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">HỦY</button>
        <button class="btn btn-confirm" id="confirmBtn" disabled>XÁC NHẬN (5)</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e)=> { if(e.target===overlay) closeModal(); };

  let sec = 5;
  const btn = document.getElementById('confirmBtn');
  const timer = setInterval(()=>{
    sec--;
    if(sec>0) btn.textContent = `XÁC NHẬN (${sec})`;
    else { btn.textContent='XÁC NHẬN'; btn.disabled=false; clearInterval(timer); }
  },1000);

  btn.onclick = ()=>{
    localStorage.removeItem(STORAGE_KEY);
    messages=[];
    document.getElementById('chat').innerHTML='';
    addBotMessage(CONFIG.welcomeMessage, getTime(), false);
    messages = [{type:'bot', text:CONFIG.welcomeMessage, time:getTime()}];
    saveMessages();
    closeModal();
  };
}
function closeModal(){ document.querySelector('.modal-overlay')?.remove(); }

// Khởi chạy
window.onload = ()=>{
  createBubbles();
  loadMessages();
  renderChips();
};
</script>
</body>
</html>
